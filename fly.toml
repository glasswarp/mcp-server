# Deploy: fly apps create glasswarp-mcp && fly deploy
# Secrets: none required (API keys are per-request Bearer from clients)
# DNS: mcp.glasswarp.com → this app

app = "glasswarp-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.http"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  MCP_ALLOWED_HOSTS = "mcp.glasswarp.com,glasswarp-mcp.fly.dev,localhost,127.0.0.1"
  GLASSWARP_API_BASE_URL = "https://signal.glasswarp.com"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep one machine warm — Cursor remote MCP clients often time out on Fly cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
